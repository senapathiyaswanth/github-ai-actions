name: Stale Issues & PRs

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6am UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            Thank you for your contributions!
          close-issue-message: >
            This issue was closed because it has been inactive for too long.
            Please reopen if you believe it is still relevant.
          exempt-issue-labels: "pinned,security,help wanted,good first issue"

          # PRs
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            recent activity. Please update or close it.
          close-pr-message: >
            This PR was closed due to inactivity. Please reopen if you wish to continue.
          exempt-pr-labels: "pinned,security,work in progress"
